[package]
name = "fuser-ng"
version = "0.8.2"
authors = ["William R. Fraser <wfraser@codewise.org>", "François NT <francois@iobuffer.me>"]
repository = "https://github.com/francois-nt/fuser-ng"
description = "A higher-level path-oriented FUSE filesystem library with optional async support."
categories = ["filesystem", "asynchronous", "os::unix-apis"]
keywords = ["fuse", "fuser", "filesystem", "async", "userspace"]
license = "MIT OR Apache-2.0"
readme = "DOC.md"
edition = "2024"
rust-version = "1.85"
include = [
    "Cargo.toml",
    "DOC.md",
    "RELEASENOTES.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**",
]

[dependencies]
fuser = "0.18"
futures-core = { version = "0.3", optional = true }
libc = "0.2"
log = "0.4"
parking_lot = "0.12.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync"], optional = true }

[features]
default = []
async = ["dep:futures-core", "dep:tokio"]

[workspace]
members = [".", "example"]
